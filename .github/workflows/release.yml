name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run unit tests
        run: node --test
      - name: Validate plugin package
        run: node scripts/validate.mjs .
      - name: Check the tag matches the release
        run: node scripts/release.mjs check "$GITHUB_REF_NAME" --tagged
      - name: Build and validate the website
        run: |
          node scripts/website-build.mjs --out "$RUNNER_TEMP/site"
          node scripts/validate.mjs "$RUNNER_TEMP/site" --site
      - name: Package the plugin
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="bento-deck-studio-$version"
          mkdir -p dist
          git archive --format=zip --prefix="$name/" -o "dist/$name.zip" "$GITHUB_REF_NAME"
          unzip -q "dist/$name.zip" -d "$RUNNER_TEMP/unpacked"
          node scripts/validate.mjs "$RUNNER_TEMP/unpacked/$name"
          (cd dist && sha256sum "$name.zip" > SHA256SUMS)
          node scripts/release.mjs notes "$version" > "$RUNNER_TEMP/notes.md"
          echo "zip=dist/$name.zip" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.zip }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "bento-deck-studio $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${{ steps.package.outputs.zip }}" dist/SHA256SUMS
