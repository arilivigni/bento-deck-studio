name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - skills/**
      - com.github.copilot/**
      - site/**
      - media/**
      - scripts/**
      - plugin.json
      - CHANGELOG.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build website
        run: node scripts/website-build.mjs --out _site --base-url "${{ steps.pages.outputs.base_url }}"
      - name: Validate website
        run: node scripts/validate.mjs _site --site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
